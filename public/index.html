<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 05</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
      <h1 id="greeting">Web Engineering Lab</h1>
      <nav>
        <ul>
          <li>
            <a
              href="#schedule"
              class="nav-link span-all"
              aria-current="location"
              >Office Hours</a
            >
          </li>
          <li><a href="#feedback" class="nav-link">Send Feedback</a></li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section id="schedule">
        <h2>Office Hours</h2>

        <table>
          <caption>
            Weekly office hours
          </caption>
          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Time</th>
              <th scope="col">Book</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monday</td>
              <td>
                <time datetime="10:00">10:00</time>–<time datetime="11:00"
                  >11:00</time
                >
              </td>
              <td>
                <button
                  type="button"
                  data-day="Monday"
                  aria-label="Select Monday"
                >
                  Select
                </button>
              </td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td>
                <time datetime="14:00">14:00</time>–<time datetime="15:00"
                  >15:00</time
                >
              </td>
              <td>
                <button
                  type="button"
                  data-day="Wednesday"
                  aria-label="Select Wednesday"
                >
                  Select
                </button>
              </td>
            </tr>
            <tr>
              <td>Friday</td>
              <td>
                <time datetime="09:00">09:00</time>–<time datetime="10:00"
                  >10:00</time
                >
              </td>
              <td>
                <button
                  type="button"
                  data-day="Friday"
                  aria-label="Select Friday"
                >
                  Select
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <figure class="location-pin">
          <svg
            role="img"
            aria-labelledby="pin-title"
            width="24"
            height="24"
            viewBox="0 0 24 24"
          >
            <title id="pin-title">Location pin</title>
            <path
              d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"
              fill="#0f0f0f"
            />
            <circle cx="12" cy="9" r="2.5" fill="#ffffff" />
          </svg>
          <figcaption class="text-muted">
            All office hours are held in Room 214.
          </figcaption>
        </figure>
        <p id="status" role="status" class="span-all text-muted"></p>
      </section>

      <section id="feedback">
        <h2>Send Feedback</h2>

        <form novalidate>
          <p>
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              autocomplete="name"
              required
            />
          </p>

          <p>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="you@case.edu"
              required
              aria-describedby="email-hint"
            />
            <span id="email-hint" class="text-muted">
              We will only use this email to reply to you.</span
            >
          </p>

          <fieldset class="span-all">
            <legend>Topic</legend>
            <input
              type="radio"
              id="topic-lectures"
              name="topic"
              value="lectures"
              required
            />
            <label for="topic-lectures">Lectures</label>
            <input type="radio" id="topic-labs" name="topic" value="labs" />
            <label for="topic-labs">Labs</label>
            <input type="radio" id="topic-other" name="topic" value="other" />
            <label for="topic-other">Other</label>
          </fieldset>

          <p class="span-all">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </p>

          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <address>Amar Khan, amarkhan@case.edu</address>
    </footer>
    <script src="script.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="feedback.js"></script>
  </body>
</html>
